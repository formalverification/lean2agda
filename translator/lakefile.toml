# File: translator/lakefile.toml
#
# The lean2agda Lake package.  TOML rather than lakefile.lean: the package
# needs no custom targets or scripts, so a declarative file suffices, Lake
# reads it without elaborating Lean code, and it is the form `lake new`
# writes and lean4export uses.  `lake translate-config lean` converts it if
# a later issue needs code in the configuration.
#
# Every pin here is explained, with the command that moves it, in
# docs/pinning.md.  In short: Mathlib is pinned to the release tag that
# matches ./lean-toolchain (a symlink to the repository's lean-toolchain,
# so the flake, elan and Mathlib's cache tool read one file), and
# lake-manifest.json records the commit each tag resolved to.  Run every
# `lake update` with --keep-toolchain so that Lake never rewrites the
# toolchain through the symlink.

name = "lean2agda"
defaultTargets = ["Lean2Agda", "lean2agda", "atlas"]

# `lake test` builds and runs the executable `unittests` below (issue
# M2-11).  An executable driver runs every check at every invocation; a
# library driver would only build its modules, so a check would run only
# when Lake rebuilt it, and one that reads a fixture would pass stale
# after the fixture changed.  The name has no hyphen: Lake 5.0 decodes a
# target's `name` leniently but looks the driver up with `String.toName`,
# which gives no name for `unit-tests` (docs/lean-findings.md, LF-14).
testDriver = "unittests"

[leanOptions]
autoImplicit = false

# The kernel-term exporter (NDJSON), which records the exported term of
# each corpus entry.  Its nearest release tag is one patch release behind
# the pinned Lean; there is no v4.33.1 tag.  Run it with
# `lake exe lean4export`.
[[require]]
name = "lean4export"
git = "https://github.com/leanprover/lean4export"
rev = "v4.33.0"

# Mathlib at the tag of the pinned Lean release.  Mathlib's prebuilt .olean
# files come from `lake exe cache get`; never build Mathlib from source.
# Mathlib's requirement comes last, as its cache tool advises: should a
# later requirement share a dependency with Mathlib, Mathlib's revision
# then wins, and the cache tool refuses to run on any other.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

# The translator's pure core and its IO shell.  The executable loads
# compiled modules at run time and never imports Mathlib while building.
[[lean_lib]]
name = "Lean2Agda"

# The root is Main.lean, outside the library, so that the unit tests'
# executable can import the shell (Lean2Agda.Main) without a second
# `main`.
[[lean_exe]]
name = "lean2agda"
root = "Main"
supportInterpreter = true

# Small compiled inputs for translator tests; these import core Lean only.
[[lean_lib]]
name = "TranslatorTests"
srcDir = "tests"

# The unit checks, one module each; a module the driver imports must
# belong to a library.  Each imports the environments it checks when it
# runs, so building them needs no Mathlib.
[[lean_lib]]
name = "UnitChecks"
srcDir = "tests"
roots = ["Check", "Inductives", "Naming", "Printing", "Scaffold"]

# The test driver: tests/UnitTests.lean runs the checks, or those named
# after `lake test --`.  supportInterpreter lets the imports run the
# fixtures' `initialize` declarations, as the translator's does.
[[lean_exe]]
name = "unittests"
root = "UnitTests"
srcDir = "tests"
supportInterpreter = true

# Optional full-population naming check; it reads atlas records, never Mathlib.
[[lean_exe]]
name = "naming-check-atlas"
root = "TranslatorTests.NamingAtlas"
srcDir = "tests"

# Optional original-name cross-check; requires Mathlib's prebuilt cache.
[[lean_exe]]
name = "naming-atlas-probe"
root = "NamingAtlasProbe"
srcDir = "scripts"
supportInterpreter = true

# The axiom atlas (issue M1-11): `lake exe atlas` writes one NDJSON record
# per constant of the pinned Mathlib to ../atlas/.  Its code imports Lean
# only and loads Mathlib's .olean files when it runs, so building it never
# needs Mathlib's modules; supportInterpreter lets the import run the
# `initialize` declarations of Mathlib's modules.
[[lean_lib]]
name = "Atlas"

[[lean_exe]]
name = "atlas"
root = "Atlas.Main"
supportInterpreter = true
