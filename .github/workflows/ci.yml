name: ci

# Two kinds of job.  The `checks` and `static` jobs come from the
# github-project template and need no Nix (setup-python is enough):
# `checks` is the structural gate on docs/GITHUB_PROJECT.md, and
# `static` lints the scripts under scripts/ (shellcheck, and ruff once
# there is Python).  In the engine repository (and in template copies
# that have not yet run `make init`) the local engine is present:
# `checks` runs its test suite and lints the plan with it.  In a
# detached consumer project such as this one the engine steps skip
# themselves (hashFiles on an absent file is empty), a pinned engine
# checkout is fetched, and the plan lint still runs, so the gate needs
# no engine files in the tree.
#
# The `nix` job is the project's own lane: it enters the flake's default
# dev shell, the one `nix develop` gives a developer, and runs the
# project's make targets there, so CI checks with exactly the toolchain
# flake.lock pins.  Its comment below says what it runs and how it uses
# the Cachix cache.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the documented floor; 3.12 the current default.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Engine test suite (local engine present)
        if: hashFiles('scripts/gh_project_populate.py') != ''
        run: make test

      # Pinned, never floating `main`: a consumer's CI must not change
      # behavior underneath an unchanged commit.  Resolution order:
      # the github-project rev in flake.lock (the pin Nix consumers
      # upgrade deliberately), the GHPROJECT_ENGINE_REF repository
      # variable, the default release tag.
      - name: Resolve the engine pin (detached consumer projects only)
        id: enginepin
        if: hashFiles('scripts/gh_project_populate.py') == ''
        run: |
          rev=$(jq -r '.nodes["github-project"].locked.rev // empty' \
                flake.lock 2>/dev/null || true)
          echo "ref=${rev:-${{ vars.GHPROJECT_ENGINE_REF || 'v0.2.0' }}}" \
            >> "$GITHUB_OUTPUT"

      - name: Fetch the engine (detached consumer projects only)
        if: hashFiles('scripts/gh_project_populate.py') == ''
        uses: actions/checkout@v4
        with:
          repository: williamdemeo/github-project
          ref: ${{ steps.enginepin.outputs.ref }}
          path: .github-project-engine

      - name: Structural lint of the plan file
        run: make lint GHPROJECT_DIR=.github-project-engine

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shellcheck
        run: shellcheck scripts/ci/*.sh

      - name: Python lint (errors and pyflakes only)
        if: hashFiles('scripts/**/*.py') != ''
        run: |
          pip install ruff
          ruff check --select E9,F scripts/

  # The Nix lane: the flake's default dev shell on a fresh runner, which
  # is issue #2's acceptance test ("on a machine with only Nix").  The
  # runner image has its own python3, gh, jq, git and make, and a plain
  # `nix develop` appends the caller's PATH after the shell's, so a tool
  # the shell lost would still resolve.  --ignore-environment drops the
  # runner's environment, PATH included, so every tool the job runs must
  # come from the shell; HOME is kept, as any real machine sets it.  A
  # later target that reads another variable passes it with --keep NAME.
  #
  # It runs `make doctor`, whose two Agda probes check that the shell's
  # agda resolves both libraries; `make corpus-check`, which type-checks
  # every translated corpus entry under the flags its files declare; and
  # `make test`, the Python suite.  Make stops at the first target that
  # fails.  Later checks join the same `nix develop --command` rather
  # than a second job, so each run evaluates the flake once.  `make
  # doctor` runs the engine's lint CLI with --help, which reads no
  # token, so NO_ENV_PREFIX is not set.
  #
  # Cachix.  Pulling from the public `formalverification` cache needs no
  # token.  The write-capable CACHIX_AUTH_TOKEN reaches cachix-action
  # only when the checked-out ref is `main` (the trust boundary
  # agda-native-air adopted in its issue 187): a token the action
  # installs is readable by every later step, and a pull request's run
  # executes make targets the pull request controls.  Every other run
  # pulls with skipPush set and pushes nothing.  The secret goes only
  # through the action's authToken input, never through an `env:` block,
  # which would hand it to every step of every run.  What a `main` run
  # pushes (the Lean toolchain, the Agda environment, the engine, the
  # shell's environment) becomes publicly downloadable; none of it is
  # secret.
  #
  # Expect `warning: ignoring untrusted flake configuration setting
  # 'extra-substituters'`: a non-interactive `nix develop` declines the
  # flake's nixConfig, but cachix-action has already run `cachix use`, so
  # the cache is wired anyway.  Judge the cache by the log's
  # "copying path ... from 'https://formalverification.cachix.org'" lines.
  nix:
    name: Nix lane (default dev shell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # The default shell's inputs come to about 8.3 GiB in the store
      # (Lean 2.9 GiB; GHC, which the Agda wrapper carries, 2.6 GiB; LLVM
      # and clang 1.4 GiB), and a cold run builds lean4-nix's toolchain
      # derivation, which holds the unpacked release twice while it moves
      # it into the store.  The lane's first run filled the runner's disk
      # doing that.  None of the runner image's largest preinstalled
      # toolchains is used here, so they go before Nix does anything.
      - name: Free disk space for the Nix store
        run: |
          set -euxo pipefail
          df -h / /mnt || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          df -h / /mnt || true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: formalverification
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      - name: make doctor, corpus-check and test in the default dev shell
        run: |
          set -euxo pipefail
          nix develop --ignore-environment --keep HOME \
            --command make doctor corpus-check test

      - name: Disk usage after entering the shell
        if: always()
        run: df -h / /mnt || true
